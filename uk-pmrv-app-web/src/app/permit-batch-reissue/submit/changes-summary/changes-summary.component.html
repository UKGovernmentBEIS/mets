<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    <app-wizard-step
      (formSubmit)="onSubmit()"
      [formGroup]="form"
      heading="Enter a summary of changes for the permit variation log"
      caption="Start a batch variation"
      submitText="Continue"
      [showBackLink]="true">
      <div class="govuk-hint">The operator will see this in the approved permit document.</div>
      <div
        govuk-textarea
        [maxLength]="10000"
        hint=" 
Enter a summary for all items that were added to the variation schedule."
        formControlName="changesSummary"></div>
    </app-wizard-step>
  </div>
</div>
