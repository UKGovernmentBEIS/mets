<span id="site-contacts-search-hint" class="govuk-hint">Search by account name or ID</span>
<form (ngSubmit)="onSearch()" [formGroup]="searchForm" id="site-contacts-search-form">
  <div class="govuk-grid-row govuk-!-margin-bottom-3">
    <div class="govuk-grid-column-three-quarters">
      <div
        formControlName="term"
        [isLabelHidden]="true"
        label="Search by account name or ID"
        autoComplete="off"
        govuk-text-input
        aria-describedby="site-contacts-search-hint"></div>
    </div>
    <div class="govuk-grid-column-one-quarter">
      <button appPendingButton govukButton type="submit">Search</button>
    </div>
  </div>
</form>

<form (ngSubmit)="onSave()" *ngIf="isEditable$ | async; else simpleTable" [formGroup]="form" id="site-contacts-form">
  <ng-container *ngIf="tableData$ | async as tableData">
    <ng-container *ngIf="tableData.length; else noResults">
      <govuk-table [columns]="columns" [data]="tableData" formArrayName="siteContacts">
        <ng-template let-column="column" let-index="index" let-row="row">
          <ng-container [formGroupName]="index" [ngSwitch]="column.field">
            <ng-container *ngSwitchCase="'user'">
              <div
                [options]="assigneeOptions$ | async"
                formControlName="userId"
                govuk-select
                widthClass="govuk-!-width-full"
              ></div>
            </ng-container>
            <ng-container *ngSwitchDefault>{{ row[column.field] }}</ng-container>
          </ng-container>
        </ng-template>
      </govuk-table>
    </ng-container>
  </ng-container>

  <ng-container *ngTemplateOutlet="pagination"></ng-container>

  <div class="govuk-button-group">
    <button appPendingButton govukButton type="submit" class="govuk-!-margin-top-3">Save</button>
    <button govukSecondaryButton type="button" (click)="refresh$.next()">Discard changes</button>
  </div>
</form>

<ng-template #simpleTable>
  <ng-container *ngIf="tableData$ | async as tableData">
    <ng-container *ngIf="tableData.length; else noResults">
      <govuk-table [columns]="columns" [data]="tableData">
        <ng-template let-column="column" let-row="row">
          <ng-container [ngSwitch]="column.field">
            <ng-container *ngSwitchCase="'user'">{{
              row[column.field] ? (row[column.field] | userFullName) : 'Unassigned'
            }}</ng-container>
            <ng-container *ngSwitchDefault>{{ row[column.field] }}</ng-container>
          </ng-container>
        </ng-template>
      </govuk-table>
    </ng-container>
  </ng-container>

  <ng-container *ngTemplateOutlet="pagination"></ng-container>
</ng-template>

<ng-template #noResults>
  <p class="govuk-body" tabindex="-1">
    No matching accounts found. Try searching for a different account name, or clear the search to view all
    accounts.
  </p>
</ng-template>

<ng-template #pagination>
  <app-pagination
    [count]="count$ | async"
    (currentPageChange)="page$.next($event)"
    [pageSize]="pageSize"
  ></app-pagination>
</ng-template>
