@let vm = this.vm();

<app-ner-task
  heading="Upload new entrant reserve verification opinion statement"
  caption="NER verification opinion statement"
  [taskType]="vm.requestTaskType">
  <div class="govuk-!-width-three-quarters">
    <app-wizard-step (formSubmit)="onContinue()" [formGroup]="form" [hideSubmit]="!vm.isEditable">
      <div class="govuk-!-width-three-quarters">
        <app-file-input
          [downloadUrl]="getDocumentDownloadUrl"
          formControlName="opinionStatementFile"
          label="Upload file"
          headerSize="s"
          listTitle="Uploaded files"
          [showFilesizeHint]="false"></app-file-input>

        <app-multiple-file-input
          [baseDownloadUrl]="vm.downloadUrl"
          label="Upload supporting files"
          headerSize="s"
          listTitle="Uploaded files"
          formControlName="supportingFiles"></app-multiple-file-input>

        <div
          formControlName="notes"
          govuk-textarea
          label="Notes (optional)"
          labelSize="medium"
          hint="This cannot be viewed by the operator"
          [maxLength]="10000"></div>
      </div>
    </app-wizard-step>
  </div>
</app-ner-task>
