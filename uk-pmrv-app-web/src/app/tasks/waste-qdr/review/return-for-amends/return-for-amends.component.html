<ng-container *ngIf="vm() as vm">
  <ng-container *ngIf="!vm.isSubmitted; else submittedTemplate">
    <app-waste-qdr-task
      returnLink="../"
      [breadcrumb]="true"
      heading="Return for amendments"
      returnLinkTitle="Review quarterly data report">
      <p class="govuk-body">Check your information before sending</p>

      <h2 app-summary-header class="govuk-heading-m">Quarterly data report</h2>

      <app-changes-requested-template
        [requiredChanges]="$any(vm.decisionDetails)?.requiredChanges"
        [reviewAttachments]="vm.regulatorReviewAttachments"
        [downloadUrl]="vm.downloadUrl"
        [notes]="vm.decisionDetails?.notes"></app-changes-requested-template>

      <div *ngIf="vm.isEditable" class="govuk-button-group">
        <button appPendingButton govukButton type="button" (click)="onSubmit()">Confirm and complete</button>
      </div>
    </app-waste-qdr-task>
  </ng-container>
</ng-container>

<ng-template #submittedTemplate>
  <app-confirmation-shared
    title="Returned to operator for amendments"
    [whatHappensNextTemplate]="whatHappensNextTemplate"></app-confirmation-shared>
</ng-template>

<ng-template #whatHappensNextTemplate>
  <div id="whatHappensNextTemplate">
    <h3 class="govuk-heading-m">What happens next</h3>

    <p class="govuk-body">The operator will return the application to you when the amendments have been made.</p>
  </div>
</ng-template>
