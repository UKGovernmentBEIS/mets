<ng-container *ngIf="vm() as vm">
  <ng-container *ngIf="vm.isEditable && (vm.canEdit || isOnEditState); else viewDecision">
    <form (ngSubmit)="onSubmit()" [formGroup]="form">
      <govuk-error-summary *ngIf="isSummaryDisplayed$ | async" [form]="form"></govuk-error-summary>
      <h2 class="govuk-heading-m">What is your decision on the information submitted?</h2>

      <div formControlName="decision" govuk-radio>
        <govuk-radio-option value="ACCEPTED" label="Accepted"></govuk-radio-option>
        <govuk-radio-option value="OPERATOR_AMENDS_NEEDED" label="Operator amendments needed">
          <div govukConditionalContent>
            <div>
              <h3 #conditionalHeader class="govuk-heading-s">Changes required by the operator</h3>
            </div>

            <div formArrayName="requiredChanges">
              <fieldset
                *ngFor="let requiredChange of requiredChanges.controls; index as i"
                [formGroupName]="i"
                [disabled]="!vm.isEditable"
                govukFieldset
                id="required-changes-{{ i }}">
                <legend class="govuk-heading-s">Required change {{ i + 1 }}</legend>
                <button
                  (click)="requiredChanges.removeAt(i)"
                  *ngIf="requiredChanges.length > 1"
                  [disabled]="!vm.isEditable"
                  [heading]="conditionalHeader"
                  appAddAnother
                  govukSecondaryButton
                  type="button"
                  #removeButton>
                  Remove
                </button>
                <div govuk-textarea [maxLength]="10000" formControlName="reason"></div>

                <app-multiple-file-input
                  [baseDownloadUrl]="getDownloadUrl()"
                  [label]="(uploadedFiles[i] | async) === true ? 'Upload a different file' : 'Upload a file (optional)'"
                  headerSize="s"
                  [listTitle]="'Uploaded files'"
                  formControlName="files"></app-multiple-file-input>
              </fieldset>

              <button (click)="addOtherRequiredChange()" [disabled]="!vm.isEditable" govukSecondaryButton type="button">
                Add another required change
              </button>
            </div>
          </div>
        </govuk-radio-option>
      </div>

      <div
        govuk-textarea
        [maxLength]="10000"
        formControlName="notes"
        label="Notes"
        hint="This cannot be viewed by the operator"></div>
      <button appPendingButton govukButton type="submit">Confirm</button>
    </form>
  </ng-container>

  <ng-template #viewDecision>
    <h2
      app-summary-header
      class="govuk-heading-m"
      (changeClick)="isOnEditState = true"
      [changeRoute]="vm.isEditable ? '.' : null">
      Decision Summary
    </h2>

    <ng-container *ngIf="vm.decisionData as decision">
      @if (decision.type === 'ACCEPTED') {
        <dl govuk-summary-list class="govuk-summary-list--no-border summary-list--edge-border">
          <ng-container *ngTemplateOutlet="decisionStatus"></ng-container>

          <div govukSummaryListRow *ngIf="decision?.details?.notes">
            <dt govukSummaryListRowKey>Notes</dt>
            <dd class="pre-wrap" govukSummaryListRowValue>{{ decision.details.notes }}</dd>
          </div>
        </dl>
      } @else {
        <app-changes-requested-template
          [requiredChanges]="$any(decision.details)?.requiredChanges"
          [reviewAttachments]="vm.reviewAttachments"
          [downloadUrl]="vm.downloadUrl"
          [notes]="decision.details?.notes">
          <ng-container *ngTemplateOutlet="decisionStatus"></ng-container>
        </app-changes-requested-template>
      }

      <ng-template #decisionStatus>
        <div govukSummaryListRow>
          <dt govukSummaryListRowKey>Decision status</dt>
          <dd govukSummaryListRowValue>{{ decision.type | reviewBdrAlrGroupDecision }}</dd>
        </div>
      </ng-template>
    </ng-container>
  </ng-template>
</ng-container>
