<app-hseti-task [breadcrumb]="true">
  <app-page-heading caption="Provide the HSE details">Check your answers</app-page-heading>

  <app-hseti-details-summary-template
    [isEditable]="isEditable()"
    [data]="hsetiPayload().hseti"
    [hsetiFile]="hsetiFile()"
    [files]="files()"></app-hseti-details-summary-template>

  <div *ngIf="isEditable() && hideSubmit() === false" class="govuk-button-group">
    <button appPendingButton govukButton type="button" (click)="onConfirm()">Confirm and complete</button>
  </div>
</app-hseti-task>
