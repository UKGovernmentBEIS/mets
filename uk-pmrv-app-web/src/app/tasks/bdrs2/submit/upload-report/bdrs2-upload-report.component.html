<app-bdrs2-task returnLink="../.." [returnLinkTitle]="returnLinkTitle" [breadcrumb]="true">
  <app-wizard-step
    (formSubmit)="onContinue()"
    [formGroup]="form"
    heading="Upload stage 2 baseline data report file"
    caption="Provide stage 2 baseline data report"
    [hideSubmit]="!isEditable()"
    [showBackLink]="false">
    <div class="govuk-!-width-three-quarters">
      <app-file-input
        [downloadUrl]="getDocumentDownloadUrl"
        formControlName="bdrs2File"
        headerSize="s"
        label="Upload file"
        [customHintTemplate]="hintTemplate"
        [showFilesizeHint]="false"
        [fileNameTransformer]="renameFile.bind(this)" />
    </div>
    <div class="govuk-!-width-three-quarters">
      <app-multiple-file-input
        [baseDownloadUrl]="getDownloadUrl()"
        label="Upload supporting files (optional)"
        headerSize="s"
        listTitle="Uploaded supporting files"
        formControlName="files"></app-multiple-file-input>
    </div>
  </app-wizard-step>
</app-bdrs2-task>

<ng-template #hintTemplate>
  To download the template for stage 2 baseline data report:
  <ul class="govuk-list govuk-list--number govuk-hint">
    <li>select the relevant account from your dashboard</li>
    <li>select the 'Details' tab</li>
    <li>download and complete the latest version of the BDR file</li>
  </ul>
</ng-template>
