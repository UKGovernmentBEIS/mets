<app-bdrs2-task returnLink="../.." [returnLinkTitle]="returnLinkTitle" [breadcrumb]="true">
  <app-wizard-step
    (formSubmit)="onContinue()"
    [formGroup]="form"
    heading="Upload monitoring methodology plan"
    caption="Provide stage 2 baseline data report"
    [hideSubmit]="!isEditable()"
    [showBackLink]="false">
    <p class="govuk-body">
      If you have split relevant activity level data between UK CBAM and non-UK CBAM sub-installations, you must set out
      the methodology you applied to determine the splits in your Monitoring and Methodology Plan (MMP).
    </p>
    <p class="govuk-body">Upload an amended MMP below.</p>

    <div class="govuk-!-width-three-quarters">
      <app-file-input
        [downloadUrl]="getDocumentDownloadUrl"
        formControlName="mmpFile"
        headerSize="s"
        label="Upload file"
        [showFilesizeHint]="false" />
    </div>
    <div class="govuk-!-width-three-quarters">
      <app-multiple-file-input
        [baseDownloadUrl]="getDownloadUrl()"
        label="Upload supporting files (optional)"
        headerSize="s"
        listTitle="Uploaded supporting files"
        formControlName="files"></app-multiple-file-input>
    </div>
  </app-wizard-step>
</app-bdrs2-task>
