<app-bdrs2-task returnLink="../.." [returnLinkTitle]="returnLinkTitle" [breadcrumb]="true">
  <app-page-heading caption="Provide stage 2 baseline data report">Check your answers</app-page-heading>

  <app-bdrs2-baseline-summary-template
    [isEditable]="isEditable()"
    [data]="bdrs2()"
    [bdrFile]="bdrFiles()"
    [files]="files()"
    [mmpFile]="mmpFile()"
    [mmpFiles]="mmpFiles()"></app-bdrs2-baseline-summary-template>

  <div *ngIf="isEditable() && hideSubmit() === false" class="govuk-button-group">
    <button appPendingButton govukButton type="button" (click)="onConfirm()">Confirm and complete</button>
  </div>
</app-bdrs2-task>
