<app-bdrs2-task-review [breadcrumb]="true">
  <app-wizard-step (formSubmit)="onSubmit()" [formGroup]="form" [hideSubmit]="!isEditable()">
    <app-page-heading caption="Stage 2 BDR verification opinion statement">
      Upload stage 2 BDR verification opinion statement
    </app-page-heading>
    <div class="govuk-!-width-two-thirds">
      <app-file-input
        [downloadUrl]="getDocumentDownloadUrl"
        formControlName="opinionStatementFile"
        headerSize="s"
        listTitle="Uploaded files"></app-file-input>

      <div class="govuk-!-width-three-quarters">
        <app-multiple-file-input
          [baseDownloadUrl]="getDownloadUrl()"
          label="Upload supporting files (optional)"
          headerSize="s"
          listTitle="Uploaded files"
          formControlName="supportingFiles"></app-multiple-file-input>
      </div>

      <h2 class="govuk-heading-m">Notes (optional)</h2>
      <p class="govuk-caption-m">This cannot be viewed by the operator</p>
      <div formControlName="notes" govuk-textarea [maxLength]="10000"></div>
    </div>
  </app-wizard-step>
</app-bdrs2-task-review>
