<app-alr-task-common returnLink="../../" [breadcrumb]="true">
  <app-wizard-step
    (formSubmit)="onSubmit()"
    [formGroup]="form"
    caption="Provide information about this activity level change"
    heading="Were conservative estimates made to determine the activity level?"
    submitText="Continue"
    [hideSubmit]="(editable$ | async) === false">
    <div formControlName="conservativeDeterminesActivity" govuk-radio>
      <govuk-radio-option [value]="true" label="Yes">
        <ng-container govukConditionalContent>
          <h2 class="govuk-heading-s">Explain why the estimate was made</h2>
          <span class="govuk-body govuk-hint">Include:</span>
          <ul class="govuk-list govuk-list--bullet govuk-hint">
            <li>the date that the estimate was made</li>
            <li>
              copy and edit the following: 'We gave you notice of our estimate of the value of a parameter on [insert
              date] because [insert text to explain why estimate was made]'
            </li>
          </ul>
          <div
            govuk-textarea
            formControlName="conservativeDeterminesActivityComment"
            [maxLength]="10000"
            hint="This will be entered into the official notice"></div>
        </ng-container>
      </govuk-radio-option>
      <govuk-radio-option [value]="false" label="No"></govuk-radio-option>
    </div>
  </app-wizard-step>
</app-alr-task-common>
