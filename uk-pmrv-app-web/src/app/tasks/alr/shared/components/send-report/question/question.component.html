<app-alr-task returnLink="../../" returnLinkTitle="Amend activity level report" [breadcrumb]="true">
  <app-wizard-step
    (formSubmit)="onContinue()"
    [formGroup]="form"
    heading="Submit your report"
    [hideSubmit]="!isEditable()"
    [showBackLink]="true">
    <p class="govuk-body">
      You can either send the ALR to verifier for verification opinion or send it directly to your Regulator ({{
        competentAuthority() | competentAuthority
      }}).
    </p>

    <div
      formControlName="needsVerification"
      govuk-radio
      legend="Do you want to send this report to a verifier?"
      [legendSize]="'medium'"
      class="govuk-!-width-three-quarters">
      <govuk-radio-option [value]="true" label="Yes, send the report to a verifier"></govuk-radio-option>
      <govuk-radio-option
        [value]="false"
        label="No, send the report to a regulator without verification"></govuk-radio-option>
    </div>
  </app-wizard-step>
</app-alr-task>
