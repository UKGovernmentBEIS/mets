<ng-container *ngIf="vm() as vm">
  <ng-container *ngTemplateOutlet="actionContainer"></ng-container>

  <ng-template #actionContainer>
    <app-base-action-container-component
      [header]="vm.header"
      [customContentTemplate]="customContentTemplate"
      [expectedActionType]="vm.expectedActionType"></app-base-action-container-component>
  </ng-template>

  <ng-template #customContentTemplate>
    <ul class="app-task-list">
      <li app-task-section title="HSE target increase details">
        <ul app-task-item-list>
          <li app-task-item link="details" linkText="Provide the HSE details"></li>
        </ul>
      </li>
    </ul>

    <ng-container *ngIf="vm.hasOverallDecision">
      <ul class="app-task-list">
        <li app-task-section title="Decision">
          <ul app-task-item-list>
            <li app-task-item link="overall-decision" linkText="Overall decision"></li>
          </ul>
        </li>
      </ul>

      <h2 app-summary-header class="govuk-heading-m">Official notice recipients</h2>
      <dl govuk-summary-list appGroupedSummaryList class="govuk-!-margin-bottom-6">
        <div govukSummaryListRow *ngIf="vm.notificationUsers as notificationUsers">
          <dt govukSummaryListRowKey>Users</dt>
          <dd govukSummaryListRowValue>
            <div *ngFor="let user of notificationUsers">
              {{ user }}
            </div>
          </dd>
        </div>
        <div govukSummaryListRow *ngIf="vm.signatoryName as signatoryName">
          <dt govukSummaryListRowKey>Name and signature on the official notice</dt>
          <dd govukSummaryListRowValue>
            {{ signatoryName }}
          </dd>
        </div>
        <div govukSummaryListRow>
          <dt govukSummaryListRowKey>Official notice</dt>
          <dd govukSummaryListRowValue>
            <app-summary-download-files [files]="vm.officialNoticeFiles"></app-summary-download-files>
          </dd>
        </div>
      </dl>
    </ng-container>
  </ng-template>
</ng-container>
