<app-wizard-step
  (formSubmit)="onContinue()"
  [formGroup]="form"
  submitText="Continue"
  [hideSubmit]="(store.isEditable$ | async) === false">
  <span class="govuk-caption-l">Permit revocation</span>

  <app-page-heading>Is a final year activity level report required?</app-page-heading>

  <div formControlName="alrRequired" govuk-radio legendSize="medium">
    <govuk-radio-option [value]="true" label="Yes">
      <ng-container govukConditionalContent>
        <div
          formControlName="alrReportDate"
          govuk-date-input
          label="When is the revocation report required?"
          [isRequired]="true"></div>
      </ng-container>
    </govuk-radio-option>
    <govuk-radio-option [value]="false" label="No"></govuk-radio-option>
  </div>
</app-wizard-step>

<a govukLink routerLink="../../">Return to: Permit revocation</a>
