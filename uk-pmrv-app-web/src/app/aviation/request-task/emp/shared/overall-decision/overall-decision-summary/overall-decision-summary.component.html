@if (vm$ | async; as vm) {
  <app-page-heading>{{ vm.pageHeader }}</app-page-heading>

  <h2 class="govuk-heading-m">Details</h2>

  @if (vm.data) {
    <app-overall-decision-summary-template
      [data]="vm.data"
      [isEditable]="vm.isEditable"
      [changeUrlQueryParams]="{ change: true }"
      [variationScheduleItems]="vm.variationScheduleItems"></app-overall-decision-summary-template>
  }
  <div class="govuk-button-group">
    @if (!vm.hideSubmit) {
      <button (click)="onSubmit()" appPendingButton govukButton type="button">Confirm and complete</button>
    }
  </div>
}

<app-return-to-link></app-return-to-link>
