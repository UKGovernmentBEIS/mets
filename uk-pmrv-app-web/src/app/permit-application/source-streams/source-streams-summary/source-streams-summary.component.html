<app-permit-task
  [notification]="notification"
  [breadcrumb]="true"
  reviewGroupTitle="Fuels and equipment inventory"
  reviewGroupUrl="fuels">
  <app-page-heading caption="Fuels and equipment inventory">Source streams (fuels and materials)</app-page-heading>

  <app-summary-header [changeRoute]="(store.isEditable$ | async) === true ? '..' : undefined" class="govuk-heading-m">
    <span class="govuk-visually-hidden">List of source streams</span>
  </app-summary-header>

  <app-source-streams-table [data]="'sourceStreams' | task | async" [isEditable]="false"></app-source-streams-table>

  <app-list-return-link reviewGroupTitle="Fuels and equipment inventory" reviewGroupUrl="fuels"></app-list-return-link>
</app-permit-task>
