<app-permit-task
  [notification]="notification"
  [breadcrumb]="true"
  reviewGroupTitle="Installation details"
  reviewGroupUrl="details">
  <app-page-heading caption="Installation details">Other environmental permits or licenses</app-page-heading>
  <p class="govuk-body">
    Examples include the ‘Environmental Protection Regulations’ and ‘Discharges to surface water and groundwater
    environmental’ permits.
  </p>
  <app-summary-header [changeRoute]="(store.isEditable$ | async) === true ? '..' : undefined" class="govuk-heading-m">
    Environmental permits and licenses
  </app-summary-header>
  <app-permits-summary-template
    [environmentalPermitsAndLicences]="environmentalPermitsAndLicences$ | async"></app-permits-summary-template>
  <app-list-return-link reviewGroupTitle="Installation details" reviewGroupUrl="details"></app-list-return-link>
</app-permit-task>
