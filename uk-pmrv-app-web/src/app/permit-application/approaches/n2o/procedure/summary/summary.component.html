<app-permit-task
  [notification]="notification"
  [breadcrumb]="[{ text: 'MEASUREMENT_N2O' | monitoringApproachDescription, link: ['nitrous-oxide'] }]">
  <app-page-heading [caption]="'MEASUREMENT_N2O' | monitoringApproachDescription">
    {{ taskKey$ | async | i18nSelect: heading }}
  </app-page-heading>

  <app-template [taskKey]="taskKey$ | async"></app-template>

  <app-summary-header [changeRoute]="(store.isEditable$ | async) === true ? '..' : undefined" class="govuk-heading-m">
    <span class="govuk-visually-hidden">{{ taskKey$ | async | i18nSelect: heading }}</span>
  </app-summary-header>

  <app-procedure-form-summary
    [details]="procedure$ | async"
    cssClass="summary-list--edge-border"></app-procedure-form-summary>
  <app-approach-return-link
    [parentTitle]="'MEASUREMENT_N2O' | monitoringApproachDescription"
    reviewGroupUrl="nitrous-oxide"></app-approach-return-link>
</app-permit-task>
