<dl govuk-summary-list [hasBorders]="hasBottomBorder" [class]="cssClass">
  <div govukSummaryListRow>
    <dt govukSummaryListRowKey>{{ quartelyTitle }}</dt>
    <dd govukSummaryListRowValue>
      {{ reportProvided ? 'Yes' : 'No' }}
    </dd>
    <dd govukSummaryListRowActions *ngIf="isEditable">
      <a govukLink [routerLink]="changeLink" [state]="{ changing: true }" hidden-text="report provided">Change</a>
    </dd>
  </div>
  @if (reportProvided) {
    <div govukSummaryListRow>
      <dt govukSummaryListRowKey>Completed quarterly report</dt>
      <dd govukSummaryListRowValue>
        <app-summary-download-files [files]="[qdrReport]"></app-summary-download-files>
      </dd>
      <dd govukSummaryListRowActions *ngIf="isEditable">
        <a govukLink [routerLink]="changeLink" [state]="{ changing: true }" hidden-text="waste qdr report">Change</a>
      </dd>
    </div>
    <div govukSummaryListRow *ngIf="supportingFiles?.length > 0">
      <dt govukSummaryListRowKey>Supporting data</dt>
      <dd govukSummaryListRowValue>
        <app-summary-download-files [files]="supportingFiles"></app-summary-download-files>
      </dd>
      <dd govukSummaryListRowActions *ngIf="isEditable">
        <a govukLink [routerLink]="changeLink" [state]="{ changing: true }" hidden-text="supporting files">Change</a>
      </dd>
    </div>
    <div govukSummaryListRow *ngIf="notes">
      <dt govukSummaryListRowKey>Notes</dt>
      <dd govukSummaryListRowValue>
        {{ notes }}
      </dd>
      <dd govukSummaryListRowActions *ngIf="isEditable">
        <a govukLink [routerLink]="changeLink" [state]="{ changing: true }" hidden-text="notes">Change</a>
      </dd>
    </div>
  } @else {
    <div govukSummaryListRow *ngIf="reasonForUnprovided">
      <dt govukSummaryListRowKey>Reason for not submitting a quarterly report</dt>
      <dd govukSummaryListRowValue>
        {{ reasonForUnprovided }}
      </dd>
      <dd govukSummaryListRowActions *ngIf="isEditable">
        <a govukLink [routerLink]="changeLink" [state]="{ changing: true }" hidden-text="the reason for unprovided">
          Change
        </a>
      </dd>
    </div>
  }
</dl>
