<ul class="govuk-list">
  <li *ngFor="let account of accounts" class="search-results-list_item">
    <div class="govuk-grid-row">
      <div class="govuk-grid-column-three-quarters">
        <a routerLink="." (click)="clickAccount($event, account)" govukLink>{{ account.name }}</a>
        <ul class="account-metadata">
          <li class="account-metadata-item govuk-hint">
            {{ account.emitterId }}
          </li>
          @if (account?.['legalEntityName']) {
            <li class="account-metadata-item govuk-hint">
              {{ account?.['legalEntityName'] }}
            </li>
          }
        </ul>
      </div>
      <div class="govuk-grid-column-one-quarter govuk-!-text-align-right">
        <govuk-tag color="grey">
          {{ account.status | accountStatus }}
        </govuk-tag>
      </div>
    </div>
  </li>
</ul>
