<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    <app-page-heading size="l">Are you sure you want to delete this report?</app-page-heading>

    <p class="govuk-body">This report will no longer be available to you or other METS users.</p>

    <div class="govuk-button-group">
      <button type="button" (click)="onDelete()" appPendingButton govukWarnButton>Yes, delete</button>
      <a govukLink routerLink="../">Cancel</a>
    </div>
  </div>
</div>
